[project]
name = "manutencao-prescritiva-enterprise"
version = "2.0.0"
description = "Solução enterprise de manutenção prescritiva com FastAPI, PostgreSQL, pgvector, Streamlit e RAG"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pandas>=2.3,<3",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "joblib>=1.5,<2",
  "sentence-transformers>=5,<6",
  "pypdf>=5.8,<6",
  "httpx>=0.28,<1",
  "streamlit>=1.47,<2",
  "plotly>=6.2,<7",
  "tenacity>=9.1,<10",
  "python-json-logger>=3.3,<4",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "redis>=6.2,<7",
  "celery>=5.5,<6",
  "rank-bm25>=0.2,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pytest-cov>=6.2,<7"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
